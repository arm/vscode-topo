name: Publish

on:
    workflow_dispatch:
        inputs:
            pre-release:
                type: boolean
                description: Pre-release
                default: false

env:
    NODE_VERSION: 22.x
    PRE_RELEASE_FLAG: ${{ inputs.pre-release && '--pre-release' || '' }}

permissions:
    contents: read

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    ci:
        uses: ./.github/workflows/ci.yaml

    prepare-version:
        name: Prepare Version
        needs: ci
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.calculate-version.outputs.version }}
            release_commit: ${{ steps.commit-version.outputs.release_commit }}
        steps:
            - name: Require a branch
              if: github.ref_type != 'branch'
              run: |
                  echo '::error::Run Publish from a branch.'
                  exit 1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install NPM dependencies
              run: npm ci --ignore-scripts --prefer-offline --no-audit --fund=false
            - name: Calculate Version
              id: calculate-version
              run: |
                  VERSION=$(npm run calculate-new-version --silent -- "$PRE_RELEASE_FLAG")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            - name: Update extension version
              if: steps.calculate-version.outputs.version
              run: npm version --no-git-tag-version ${{ steps.calculate-version.outputs.version }}
            - id: get-app-token
              if: steps.calculate-version.outputs.version
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ secrets.TOPO_ACCESS_APP_ID }}
                  private-key: ${{ secrets.TOPO_ACCESS_APP_PRIVATE_KEY }}
                  permission-contents: write
            - name: Generate release notes and changelog
              if: steps.calculate-version.outputs.version
              run: |
                  NOTES_FILE="$RUNNER_TEMP/generated-release-notes.md"
                  gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                      --field tag_name="v$VERSION" \
                      --field target_commitish="$GITHUB_SHA" \
                      --jq .body > "$NOTES_FILE"
                  sed -E -i \
                      "s| by @[[:alnum:]_-]+(\\[bot\\])? in https://github.com/${GITHUB_REPOSITORY}/pull/([0-9]+)| (#\\2)|g" \
                      "$NOTES_FILE"
                  awk '
                      /^## New Contributors$/ { skip = 1; next }
                      skip && /^\*\*Full Changelog\*\*/ { skip = 0 }
                      skip && /^## / { skip = 0 }
                      !skip { print }
                  ' "$NOTES_FILE" > "$NOTES_FILE.tmp"
                  mv "$NOTES_FILE.tmp" "$NOTES_FILE"

                  cp "$NOTES_FILE" release-notes.md

                  {
                      sed -n '1,/^## /{ /^## /q; p; }' CHANGELOG.md
                      printf '\n## %s\n\n' "$VERSION"
                      cat "$NOTES_FILE"
                      printf '\n\n'
                      sed -n '/^## /,$p' CHANGELOG.md
                  } > CHANGELOG.md.new
                  mv CHANGELOG.md.new CHANGELOG.md
              env:
                  VERSION: ${{ steps.calculate-version.outputs.version }}
                  GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
            - name: Store release notes
              if: steps.calculate-version.outputs.version
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: release-notes
                  path: ./release-notes.md
                  if-no-files-found: error
                  overwrite: true
            - name: Commit and push release version
              id: commit-version
              if: steps.calculate-version.outputs.version
              env:
                  VERSION: ${{ steps.calculate-version.outputs.version }}
                  GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
              run: |
                  set -euo pipefail
                  git config user.email "135710658+extensions-repo-access[bot]@users.noreply.github.com"
                  git config user.name "extensions-repo-access[bot]"
                  git add package.json package-lock.json CHANGELOG.md
                  git commit -m "chore: $VERSION release"
                  gh auth setup-git
                  git push origin "HEAD:$GITHUB_REF"
                  echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    build:
        name: Build ${{ matrix.platform }}
        needs: prepare-version
        if: needs.prepare-version.outputs.release_commit
        runs-on: ubuntu-latest
        strategy:
            matrix:
                platform:
                    - win32-x64
                    - linux-x64
                    - linux-arm64
                    - darwin-arm64
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ needs.prepare-version.outputs.release_commit }}
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install NPM dependencies
              run: npm ci --ignore-scripts --prefer-offline --no-audit --fund=false
            - name: Download other dependencies
              run: npm run download -- --target ${{ matrix.platform }}
            - name: Package VSIX
              run: npm run package -- --target ${{ matrix.platform }} $PRE_RELEASE_FLAG
              env:
                  AZURE_ANALYTICS_CONNECTION_STRING: ${{ secrets.AZURE_ANALYTICS_CONNECTION_STRING }}
            - name: Upload VSIX
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: vsix-package-${{ matrix.platform }}
                  path: ./*${{ matrix.platform }}*.vsix
                  retention-days: 1
                  if-no-files-found: error

    release:
        name: Release
        needs:
            - prepare-version
            - build
        if: needs.prepare-version.outputs.version
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  path: artifacts
            - name: Download release notes
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: release-notes
                  path: release-notes
            - name: Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
              with:
                  files: artifacts/*/*.vsix
                  body_path: release-notes/release-notes.md
                  tag_name: v${{ needs.prepare-version.outputs.version }}
                  target_commitish: ${{ needs.prepare-version.outputs.release_commit }}
                  prerelease: ${{ inputs.pre-release }}

    publish:
        name: Publish
        needs:
            - prepare-version
            - release
        if: needs.prepare-version.outputs.version
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ needs.prepare-version.outputs.release_commit }}
                  persist-credentials: false
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  pattern: vsix-package-*
                  merge-multiple: true
                  path: artifacts
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Publish to VS Code Marketplace
              run: npx --yes @vscode/vsce@3.9.2 publish --skip-duplicate -i artifacts/*.vsix -p ${{secrets.VS_MARKETPLACE_TOKEN}} $PRE_RELEASE_FLAG
            - name: Publish to Open VSX
              run: npx --yes ovsx@1.0.2 publish --skip-duplicate -i artifacts/*.vsix -p ${{secrets.OPEN_VSX_TOKEN}} $PRE_RELEASE_FLAG
