name: 'Lint PR'

on:
    pull_request:
        branches: [main]
        types: [opened, reopened, edited, synchronize]

jobs:
    validate-title:
        name: Validate PR title
        runs-on: ubuntu-slim
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
              with:
                  subjectPattern: ^[a-z].+$
                  subjectPatternError: 'PR title must not start with a capital letter. Got: "${subject}"'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
