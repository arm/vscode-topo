name: 'Lint PR'

on:
    pull_request:
        branches: [main]
        types: [opened, reopened, edited, synchronize]

jobs:
    validate-title:
        name: Validate PR title
        runs-on: ubuntu-slim
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
              with:
                  subjectPattern: ^[a-z].+$
                  subjectPatternError: 'PR title must not start with a capital letter. Got: "${subject}"'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
